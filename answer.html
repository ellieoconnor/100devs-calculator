<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="description" content="Your description goes here">
        <meta name="keywords" content="one, two, three">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <title>Blank Template</title>

        <!-- external CSS link -->
        <link rel="stylesheet" href="answer.css">
        <link rel="stylesheet" href="reset.css">
    </head>
    <body>
        <h1>100Devs Calculator</h1>
        <div class="calculator-body">
            <div id="display"></div>
            <section class="buttons">
                <button class="cal-button number">7</button>
                <button class="cal-button number">8</button>
                <button class="cal-button number">9</button>
                <button id="divide-button" class="cal-button operator">/</button>
                <button class="cal-button number">4</button>
                <button class="cal-button number">5</button>
                <button class="cal-button number">6</button>
                <button id="multiply-button" class="cal-button operator">X</button>
                <button class="cal-button number">1</button>
                <button class="cal-button number">2</button>
                <button class="cal-button number">3</button>
                <button id="add-button" class="cal-button operator">+</button>
                <button class="cal-button number">0</button>
                <button id="decimal-button" class="cal-button">.</button>
                <button id="equal-button" class="cal-button">=</button>
                <button id="subtract-button" class="cal-button operator">-</button>
                <!--<button class="cal-button clear-button">Clear</button>-->
            </section>
        </div>
        <script type="text/javascript" src="answer.js"></script>
    </body>
</html>
